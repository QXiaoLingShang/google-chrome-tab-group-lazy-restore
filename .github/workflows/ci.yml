name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.toolchain.name }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain:
          - name: minimum
            node: "22.13.0"
            pnpm: "12.6.0"
          - name: lts
            node: "24.x"
            pnpm: "12.11.2"
          - name: current
            node: "26.x"
            pnpm: "12.11.2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.toolchain.node }}
          check-latest: true
      - name: Install selected pnpm
        working-directory: ${{ runner.temp }}
        run: npm install --global pnpm@${{ matrix.toolchain.pnpm }}
      - name: Verify actual toolchain
        env:
          EXPECTED_NODE: ${{ matrix.toolchain.node }}
          EXPECTED_PNPM: ${{ matrix.toolchain.pnpm }}
        run: node scripts/verify-toolchain.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build:dev
      - run: pnpm package:release
      - name: Validate ZIP
        shell: bash
        run: |
          for archive in release/*.zip; do python -m zipfile -t "$archive"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.toolchain.name }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.os }}-${{ matrix.toolchain.name }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
